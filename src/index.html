<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git Branching Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .branch {
      padding: 15px;
      margin: 15px 0;
      border-left: 4px solid;
      background: #f5f5f5;
    }

    .main {
      border-color: green;
    }

    .feature {
      border-color: blue;
    }

    .hotfix {
      border-color: red;
    }

    code {
      background: #eee;
      padding: 3px 6px;
      border-radius: 4px;
    }
  </style>
</head>

<body>

  <h1>Git Branching Demo</h1>

  <div class="branch main">
    <h2>main</h2>
    <p>Production-ready code.</p>
    <code>git checkout main</code>
  </div>

  <div class="branch feature">
    <h2>feature/login</h2>
    <p>Development of the login functionality.</p>
    <code>git checkout -b feature/login</code>
  </div>

  <div class="branch hotfix">
    <h2>hotfix</h2>
    <p>Quick fix for a production issue.</p>
    <code>git checkout -b hotfix</code>
  </div>

</body>
</html>
